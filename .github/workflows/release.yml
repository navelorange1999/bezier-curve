name: Publish Bézier demo

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read
  actions: read

jobs:
  demo:
    uses: navelorange1999/chankay-demo-template/.github/workflows/release.yml@9f7f514ae0dfbfee82c5ba061ae350033a74a665
    with:
      slug: bezier
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
